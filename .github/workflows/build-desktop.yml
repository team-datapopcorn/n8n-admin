name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  # 태그 없이 빌드만 검증할 때 (Actions 탭 → Run workflow). 릴리즈는 만들지 않는다.
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5는 packageManager(pnpm)를 보고 캐시를 자동으로 켜는데, 그 시점엔 pnpm이 없어서 실패한다
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@10.28.2

      - name: Install root dependencies
        run: npm install

      - name: Install admin dependencies
        run: cd admin && pnpm install --frozen-lockfile

      - name: Build Next.js standalone
        run: cd admin && pnpm build

      - name: Prepare standalone
        run: |
          rm -rf build/standalone
          mkdir -p build/standalone
          # Next 16.4+는 standalone/server.js(평면), 이전은 standalone/admin/server.js. 앱은 후자를 기대한다.
          if [ -f admin/.next/standalone/server.js ]; then DEST=build/standalone/admin/; else DEST=build/standalone/; fi
          mkdir -p "$DEST"
          rsync -aL --exclude='**/@img+sharp-*' --exclude='**/*.map' \
            admin/.next/standalone/ "$DEST" 2>/dev/null || true
          mkdir -p build/standalone/admin/.next
          rsync -aL admin/.next/static/ build/standalone/admin/.next/static/
          rsync -aL admin/public/ build/standalone/admin/public/
          test -f build/standalone/admin/server.js || { echo "::error::build/standalone/admin/server.js 없음"; exit 1; }

      - name: Hoist pnpm modules
        run: |
          NMDIR="build/standalone/admin/node_modules"
          if [ -d "$NMDIR/.pnpm/node_modules" ]; then
            for pkg in "$NMDIR/.pnpm/node_modules"/*; do
              name=$(basename "$pkg")
              if [[ "$name" == @* ]] && [ -d "$pkg" ]; then
                mkdir -p "$NMDIR/$name"
                for subpkg in "$pkg"/*; do
                  subname=$(basename "$subpkg")
                  [ ! -e "$NMDIR/$name/$subname" ] && [ -d "$subpkg" ] && cp -a "$subpkg" "$NMDIR/$name/$subname"
                done
              elif [ ! -e "$NMDIR/$name" ] && [ -d "$pkg" ]; then
                cp -a "$pkg" "$NMDIR/$name"
              fi
            done
          fi

      - name: Compile Electron
        run: npx tsc -p desktop/tsconfig.json

      - name: Build DMG
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v5
        with:
          name: mac-dmg
          path: dist/*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5는 packageManager(pnpm)를 보고 캐시를 자동으로 켜는데, 그 시점엔 pnpm이 없어서 실패한다
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@10.28.2

      - name: Install root dependencies
        run: npm install

      - name: Install admin dependencies
        run: cd admin && pnpm install --frozen-lockfile

      - name: Build Next.js standalone
        run: cd admin && pnpm build

      - name: Prepare standalone
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build/standalone -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path build/standalone -Force | Out-Null
          if (Test-Path admin/.next/standalone/server.js) { $dest = 'build/standalone/admin' } else { $dest = 'build/standalone' }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Recurse -Force admin/.next/standalone/* $dest/
          New-Item -ItemType Directory -Path build/standalone/admin/.next -Force | Out-Null
          Copy-Item -Recurse -Force admin/.next/static build/standalone/admin/.next/static
          Copy-Item -Recurse -Force admin/public build/standalone/admin/public
          if (-not (Test-Path build/standalone/admin/server.js)) { Write-Error 'build/standalone/admin/server.js 없음'; exit 1 }

      - name: Ensure Windows icon
        shell: pwsh
        run: |
          if (-not (Test-Path build/icon.ico)) {
            if (Test-Path build/icon.png) {
              Copy-Item build/icon.png build/icon.ico
            }
          }

      - name: Compile Electron
        run: npx tsc -p desktop/tsconfig.json

      - name: Build exe
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v5
        with:
          name: win-exe
          path: dist/*.exe

  release:
    needs: [build-mac, build-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac-dmg/*.dmg
            artifacts/win-exe/*.exe
          body: |
            ## 다운로드

            | 플랫폼 | 파일 | 설명 |
            |--------|------|------|
            | **macOS** (Apple Silicon) | `n8n-Admin-*-mac-arm64.dmg` | DMG 설치 파일 |
            | **Windows** (x64) | `n8n-Admin-*-win-x64.exe` | NSIS 설치 파일 |

            ## 설치 방법

            ### macOS
            1. `.dmg` 파일 다운로드 → 더블클릭 → Applications 폴더에 드래그
            2. 앱 실행 → 설정 위자드에서 n8n URL + API 키 입력

            ### Windows
            1. `.exe` 파일 다운로드 → 실행 (SmartScreen 경고 시 "추가 정보" → "실행")
            2. 설치 완료 → 앱 실행 → 설정 위자드에서 n8n URL + API 키 입력

            ### GitHub 클론 (개발자)
            ```bash
            git clone https://github.com/team-datapopcorn/n8n-admin.git
            cd n8n-admin
            ./setup.sh        # macOS/Linux
            .\setup.ps1       # Windows PowerShell
            ```
